# FlowOps — full local stack.
#
# Docker is OPTIONAL. The default local workflow runs each service on the host
# (see README). Compose is provided for a one-command full stack:
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Services: postgres, redis, ai-service (Python), backend (Spring Boot), frontend (Next.js).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flowops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-flowops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-flowops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  # Redis is declared for parity with the env file but is not used by the
  # current execution queue. Keep it for the day we drop in a Redis-backed
  # QueueService; the in-memory queue (the default) ignores it entirely.
  redis:
    image: redis:7-alpine
    container_name: flowops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: flowops-ai
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
    # The AI service is NOT exposed on the host network. The backend talks to
    # it over the compose-internal network; nothing else should.
    expose:
      - "8100"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowops-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      BACKEND_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AI_SERVICE_URL: http://ai-service:8100
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required (comma-separated)}
      # JWT_SECRET and ENCRYPTION_KEY have no defaults: AuthPropertiesValidator
      # and CryptoProperties fail the boot if either is missing or weak.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 48)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -base64 32)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (e.g. https://api.flowops.example)}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-None}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowops-frontend
    environment:
      # Browser-exposed. Only ever put non-secret values behind NEXT_PUBLIC_*.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required (e.g. https://api.flowops.example)}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-FlowOps}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

volumes:
  postgres_data:
